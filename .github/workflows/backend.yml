name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "bcc_api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pyrightconfig.json"
      - ".python-version"
      - ".github/workflows/backend.yml"
  workflow_call:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest)
        working-directory: backend
        run: uv run pytest

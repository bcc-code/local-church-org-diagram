name: CD

# Deploys the .NET backend (backend_new) with the built SPA in its wwwroot to the Azure Web App (Linux, DOTNETCORE|10.0)
# serving https://org.hkonline.dk. Both are built (and tested) by the CI workflows, which upload them as artifacts; the
# app runs the published backend as it is (no build on App Service). Settings and secrets are App Service app settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend-new.yml
    with:
      publish: true

  frontend:
    uses: ./.github/workflows/frontend.yml
    with:
      publish: true

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-new
          path: publish

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: publish/wwwroot

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      # Startup applies EF Core migrations and Marten/Wolverine schema changes, so give it a while
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://org.hkonline.dk/up; then exit 0; fi
            sleep 10
          done
          echo "::error::https://org.hkonline.dk/up did not respond with 200"
          exit 1

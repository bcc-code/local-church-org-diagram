name: Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  # CD (cd.yml) runs it on main, with publish: true
  workflow_call:
    inputs:
      publish:
        description: Upload the built SPA as the artifact "frontend" for deploying
        type: boolean
        default: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm run lint:check

      - name: Type check (vue-tsc)
        run: pnpm run type-check

      - name: Test (vitest)
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Vite builds into backend/public (outDir)
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: frontend
          path: backend/public/
          if-no-files-found: error
          retention-days: 7

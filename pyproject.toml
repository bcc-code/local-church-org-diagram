[project]
name = "org-diagram"
version = "0.1.0"
description = "Org chart visualization backend"
requires-python = ">=3.14"
dependencies = [
    "flask>=2.0.0",
    "supabase>=2.20.0",
    "dotenv",
    "requests-oauth2client>=1.7.0",
    "authlib>=1.3.0",
    "gunicorn>=21.2.0",
    "swagger-client",
]

[dependency-groups]
tools = [
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.14.0",
    "ipykernel>=6.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
swagger-client = { path = "bcc_api", editable = true }

[project]
name = "org-diagram"
version = "0.1.0"
description = "Org chart visualization backend"
requires-python = ">=3.14"
dependencies = [
    "flask>=2.0.0",
    "psycopg2-binary>=2.9.11",
    "dotenv",
    "requests-oauth2client>=1.7.0",
    "authlib>=1.3.0",
    "gunicorn>=21.2.0",
    "swagger-client",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "types-psycopg2",
    "ruff>=0.16.4",
]
tools = [
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.14.0",
    "ipykernel>=6.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
swagger-client = { path = "bcc_api", editable = true }

[tool.ruff]
extend-exclude = ["bcc_api", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
